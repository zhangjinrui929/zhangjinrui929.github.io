<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title"><title id="title">看不见内部？让波替我们探路</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246b5b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba6c43"/></marker></defs><rect width="1200" height="920" rx="20" fill="#f4f1e9"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#22332e"><text x="45" y="60" font-size="32">看不见内部？让波替我们探路</text><rect x="35" y="100" width="1130" height="225" rx="14" fill="#e6ece3"/><rect x="35" y="350" width="1130" height="225" rx="14" fill="#e6ece3"/><rect x="35" y="600" width="1130" height="225" rx="14" fill="#e6ece3"/><text x="65" y="145" font-size="27">声呐：用回声看水下</text><path d="M80 200H480" fill="none" stroke="#81a8ae" stroke-width="4" /><path d="M180 175H310L290 200H200Z" fill="#58685e"/><path d="M100 290Q240 260 450 290" fill="none" stroke="#8a9481" stroke-width="4" /><path d="M250,210 L350,270" fill="none" stroke="#246b5b" stroke-width="4" marker-end="url(#a)"/><path d="M330,260 L270,215" fill="none" stroke="#ba6c43" stroke-width="4" marker-end="url(#b)"/><text x="550" y="195" font-size="26">发出声音 → 海底或鱼群 → 回声</text><text x="550" y="250" font-size="23">往返时间，帮助估计目标的距离。</text><text x="65" y="395" font-size="27">雷达：用电磁波感知</text><rect x="120" y="455" width="150" height="40" rx="10" fill="#58685e"/><path d="M150 455L170 425H225L250 455" fill="#97b0a1"/><circle cx="150" cy="500" r="14" fill="#22332e"/><circle cx="245" cy="500" r="14" fill="#22332e"/><path d="M445 420V520" fill="none" stroke="#58685e" stroke-width="4" /><path d="M290,450 L425,450" fill="none" stroke="#246b5b" stroke-width="4" marker-end="url(#a)"/><path d="M425,485 L290,485" fill="none" stroke="#ba6c43" stroke-width="4" marker-end="url(#b)"/><text x="550" y="455" font-size="24">汽车发射电磁波，接收目标的散射信号。</text><text x="550" y="510" font-size="23">距离、速度等信息藏在信号的变化中。</text><text x="65" y="645" font-size="27">超声检测：寻找材料里的裂纹</text><rect x="100" y="715" width="350" height="90" fill="#c2c9bd"/><rect x="180" y="685" width="70" height="30" rx="5" fill="#58685e"/><path d="M330 740L315 765L338 780L320 800" fill="none" stroke="#22332e" stroke-width="4" /><path d="M225,725 L305,755" fill="none" stroke="#246b5b" stroke-width="4" marker-end="url(#a)"/><path d="M295,770 L230,740" fill="none" stroke="#ba6c43" stroke-width="4" marker-end="url(#b)"/><text x="550" y="710" font-size="24">探头让固体内部产生微小的弹性振动。</text><text x="550" y="765" font-size="23">裂纹改变波的传播，回波帮助暴露缺陷。</text><text x="65" y="875" font-size="23">绿色：发出的波　　橙色：返回的信号　　图示不按实际尺度绘制</text></g></svg>