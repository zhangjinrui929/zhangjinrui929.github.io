<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title"><title id="title">从弦的受力，走向波动方程</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246b5b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba6c43"/></marker></defs><rect width="1200" height="650" rx="20" fill="#f4f1e9"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#22332e"><text x="45" y="60" font-size="32">从弦的受力，走向波动方程</text><path d="M100,480 L1090,480" fill="none" stroke="#246b5b" stroke-width="4" marker-end="url(#a)"/><path d="M100,480 L100,130" fill="none" stroke="#246b5b" stroke-width="4" marker-end="url(#a)"/><text x="1090" y="515" font-size="25">x</text><text x="65" y="140" font-size="25">y</text><path d="M140 395Q420 410 550 350Q680 290 1010 140" fill="none" stroke="#246b5b" stroke-width="4" /><path d="M450 384Q530 365 650 300" fill="none" stroke="#ba6c43"  stroke-width="8"/><circle cx="450" cy="384" r="7" fill="#ba6c43"/><circle cx="650" cy="300" r="7" fill="#ba6c43"/><path d="M450,384 L300,420" fill="none" stroke="#ba6c43" stroke-width="4" marker-end="url(#b)"/><path d="M650,300 L800,222" fill="none" stroke="#ba6c43" stroke-width="4" marker-end="url(#b)"/><text x="285" y="460" font-size="24">左端张力 T</text><text x="800" y="210" font-size="24">右端张力 T</text><path d="M450 390V500M650 305V500" fill="none" stroke="#bccbc3" stroke-width="4" stroke-dasharray="7 7"/><text x="438" y="530" font-size="25">x</text><text x="610" y="530" font-size="25">x + Δx</text><path d="M450 555H650" fill="none" stroke="#58685e" stroke-width="4" /><text x="520" y="590" font-size="25">Δx</text><text x="105" y="100" font-size="25">取出很短的一段：两端拉力的竖直分量不一定抵消。</text></g></svg>