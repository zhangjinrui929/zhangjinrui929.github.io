<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title"><title id="title">波遇见物体：原来的传播被改变了</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246b5b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba6c43"/></marker></defs><rect width="1200" height="650" rx="20" fill="#f4f1e9"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#22332e"><text x="45" y="60" font-size="32">波遇见物体：原来的传播被改变了</text><text x="100" y="125" font-size="27">没有障碍物</text><text x="700" y="125" font-size="27">遇到障碍物</text><path d="M600 145V535" fill="none" stroke="#bccbc3" stroke-width="4" /><path d="M100 200V450" fill="none" stroke="#246b5b" stroke-width="4" /><path d="M170 200V450" fill="none" stroke="#246b5b" stroke-width="4" /><path d="M240 200V450" fill="none" stroke="#246b5b" stroke-width="4" /><path d="M310 200V450" fill="none" stroke="#246b5b" stroke-width="4" /><path d="M380 200V450" fill="none" stroke="#246b5b" stroke-width="4" /><path d="M450 200V450" fill="none" stroke="#246b5b" stroke-width="4" /><path d="M670 200V450" fill="none" stroke="#246b5b" stroke-width="4" /><path d="M725 200V450" fill="none" stroke="#246b5b" stroke-width="4" /><path d="M780 200V450" fill="none" stroke="#246b5b" stroke-width="4" /><ellipse cx="920" cy="330" rx="42" ry="70" fill="#bdc4b7" stroke="#58685e" stroke-width="3"/><path d="M863 254 Q791.75 330 863 406" fill="none" stroke="#ba6c43" stroke-width="4" /><path d="M833 214 Q724.25 330 833 446" fill="none" stroke="#ba6c43" stroke-width="4" /><path d="M803 174 Q656.75 330 803 486" fill="none" stroke="#ba6c43" stroke-width="4" /><path d="M950 225 Q1072 330 950 435" fill="none" stroke="#ba6c43" stroke-width="4" /><path d="M950 175 Q1092 330 950 485" fill="none" stroke="#ba6c43" stroke-width="4" /><path d="M140,490 L420,490" fill="none" stroke="#246b5b" stroke-width="4" marker-end="url(#a)"/><path d="M690,490 L810,490" fill="none" stroke="#246b5b" stroke-width="4" marker-end="url(#a)"/><text x="200" y="535" font-size="23">入射波</text><text x="680" y="535" font-size="23">入射波</text><text x="925" y="535" font-size="23">散射扰动</text><text x="80" y="600" font-size="26">对照没有物体的情况，物体引起的额外波动就是散射场。</text></g></svg>