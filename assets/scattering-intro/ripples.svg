<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title"><title id="title">一滴水，怎样把消息传到远处？</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246b5b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba6c43"/></marker></defs><rect width="1200" height="650" rx="20" fill="#f4f1e9"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" fill="#22332e"><text x="45" y="60" font-size="32">一滴水，怎样把消息传到远处？</text><ellipse cx="530" cy="350" rx="60" ry="25.8" fill="none" stroke="#74a99a" stroke-width="4"/><ellipse cx="530" cy="350" rx="125" ry="53.75" fill="none" stroke="#74a99a" stroke-width="4"/><ellipse cx="530" cy="350" rx="190" ry="81.7" fill="none" stroke="#74a99a" stroke-width="4"/><ellipse cx="530" cy="350" rx="255" ry="109.64999999999999" fill="none" stroke="#74a99a" stroke-width="4"/><ellipse cx="530" cy="350" rx="320" ry="137.6" fill="none" stroke="#74a99a" stroke-width="4"/><ellipse cx="530" cy="350" rx="385" ry="165.55" fill="none" stroke="#74a99a" stroke-width="4"/><circle cx="530" cy="350" r="9" fill="#246b5b"/><path d="M575,330 L920,225" fill="none" stroke="#246b5b" stroke-width="4" marker-end="url(#a)"/><text x="740" y="180" font-size="25">波纹向外传播</text><rect x="737" y="385" width="65" height="23" rx="9" fill="#ba6c43" transform="rotate(-8 770 395)"/><path d="M775,380 L775,325" fill="none" stroke="#ba6c43" stroke-width="4" marker-end="url(#b)"/><path d="M775,410 L775,465" fill="none" stroke="#ba6c43" stroke-width="4" marker-end="url(#b)"/><text x="825" y="425" font-size="23">小浮标在附近起伏</text><text x="80" y="570" font-size="27">传播出去的是扰动，不是一圈水一路跑向岸边。</text><text x="80" y="610" font-size="21">示意：真实水面粒子的运动也包含水平方向的分量。</text></g></svg>