<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title">
<title id="title">一条物理因果链，两种提问方向</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#246b5b"/></marker></defs>
<rect width="1200" height="640" rx="18" fill="#f4f1e9"/>
<g fill="#22332e" font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="40" y="55" font-size="32" >一条物理因果链，两种提问方向</text><rect x="55" y="160" width="290" height="125" rx="14" fill="#e1e9de" stroke="#a4b7a8"/><rect x="855" y="160" width="290" height="125" rx="14" fill="#e1e9de" stroke="#a4b7a8"/><rect x="55" y="390" width="290" height="125" rx="14" fill="#e1e9de" stroke="#a4b7a8"/><rect x="855" y="390" width="290" height="125" rx="14" fill="#e1e9de" stroke="#a4b7a8"/><text x="80" y="210" font-size="27" >物体 / 内部状态</text><text x="80" y="250" font-size="23" >已知激励与环境</text><text x="890" y="235" font-size="30" >测量信号</text><path d="M370 222H825" stroke="#246b5b" stroke-width="4" marker-end="url(#arrow)"/><text x="430" y="185" font-size="26" >正问题：预测响应</text><text x="80" y="440" font-size="27" >未知物体 / 状态</text><text x="80" y="480" font-size="23" >寻找合理解释</text><text x="890" y="440" font-size="27" >已知测量信号</text><text x="890" y="480" font-size="23" >已知激励与环境</text><path d="M825 452H370" stroke="#246b5b" stroke-width="4" marker-end="url(#arrow)"/><text x="430" y="415" font-size="26" >反问题：由果溯因</text><text x="65" y="590" font-size="26" >箭头可以反过来问；信息是否足够，需要另外判断。</text></g></svg>