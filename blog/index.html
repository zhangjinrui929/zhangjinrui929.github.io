<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jinrui Zhang 的研究笔记与博客。">
    <meta name="theme-color" content="#f3f0e8">
    <title>博客 · Jinrui Zhang</title>
    <link rel="icon" href="../assets/avatar-placeholder.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/styles.css">
    <script src="../assets/data.js" defer></script>
    <script src="../assets/main.js" defer></script>
  </head>
  <body id="top" data-page="blog" data-base="..">
    <header class="site-header" id="site-header"></header>

    <main class="page-shell">
      <header class="page-hero reveal">
        <p class="page-kicker">NOTES / ESSAYS / FIELDWORK</p>
        <h1>研究之外的<em>持续写作</em></h1>
        <p class="page-description">在 AI 时代，我希望把应用数学研究放回更广阔的物理图景中，借助 AI 记录与写作，更系统地梳理思路、理解问题，也努力写出既有内容、又让人读得懂的文章。</p>
      </header>

      <div class="filter-bar" aria-label="文章筛选">
        <div class="filter-chips" id="blog-tags"></div>
        <label class="search-wrap">
          <span class="sr-only">搜索文章</span>
          <input class="search-input" id="blog-search" type="search" placeholder="搜索文章或标签…">
        </label>
      </div>

      <section class="page-content" aria-label="文章列表">
        <div class="post-grid" id="blog-list"></div>
        <p class="filter-empty" id="filter-empty" hidden>没有找到匹配的文章。</p>
      </section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </body>
</html>
